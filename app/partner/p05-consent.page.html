<!doctype html>
<html lang="bn"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Salmon Partner · Consent</title>
<link rel="stylesheet" href="../_shared.css"/>
<script src="../assets/js/partner-state.js"></script>
<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/network-sim.js"></script>
<style>
  .cl{display:flex;gap:11px;align-items:flex-start;margin:10px 16px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer}
  .cl input{position:absolute;opacity:0}
  .cl .cbx{width:22px;height:22px;border-radius:6px;border:1.6px solid #cbb9ad;background:#fff;display:grid;place-items:center;color:#fff;font-size:13px;flex:0 0 auto;margin-top:1px}
  .cl input:checked + .cbx{background:var(--primary);border-color:var(--primary)}
  .cl p{font-size:12.5px;color:var(--ink);line-height:1.5}
  .cl a{color:var(--primary)}
  .cl.umbrella{border-color:#e6cdd5;background:#fbf5f7}
  .cl .tag{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--primary);background:#f4e6ea;border-radius:4px;padding:1px 6px;margin-bottom:4px}
  .cl .sub{font-size:10.5px;color:var(--ink-subtle);line-height:1.45;margin-top:4px}
  .cl .ts{font-size:9.5px;color:var(--success);margin-top:4px;font-variant-numeric:tabular-nums}
  .disc-line{margin:2px 16px 8px;background:#f4e6ea;border:1px solid #e6cdd5;border-radius:10px;padding:11px 12px;font-size:12px;color:#6a4a52;line-height:1.5}
</style>
</head><body>
<div class="page-label">P05 · Consent <small>Four distinct acceptances — terms · privacy · program · data-handling undertaking · nothing pre-ticked · versioned + timestamped</small></div>
<div class="device">
  <div class="statusbar"><span>9:41</span><span>Salmon</span><span>●●● ▮</span></div>
  <div id="top" style="flex:0 0 auto"></div>
  <div class="screen" style="padding-bottom:80px" id="form"></div>
  <div class="pbtnbar"><a class="btn ghost" id="back" href="p04-program.page.html" style="flex:0 0 auto">‹</a><a class="btn" id="next" href="p06-referral.page.html" style="flex:1">Continue</a></div>
</div>
<script>
var P=window.Partner, lang='en', d=P.getDraft();
function t(bn,en){ return lang==='bn'?bn:en; }
function L(key){ return window.tr ? tr(lang,key) : key; }
// consent state is READ FROM the persisted store (survives a 3G drop / back-nav)
function accepted(k){ return !!(P.getConsents()[k]); }
function stamp(k){ var c=P.getConsents()[k]; return c ? c.acceptedAt : null; }
function toggle(k){ P.setConsent(k, !accepted(k)); d=P.getDraft(); render(); }
function needInvest(){ return d.program==='with'||d.program==='both'; }
function fmtTs(iso){ try{ return new Date(iso).toLocaleString(lang==='bn'?'bn-BD':'en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); }catch(e){ return iso; } }
// Consent returns to the program-specific info screen the applicant came through.
function prevScreen(){ var pr=d.program; return pr==='zero'?'reg-program-zero.page.html':(pr==='with'||pr==='both')?'reg-program-with.page.html':'p04-program.page.html'; }
function bar(){ document.getElementById('top').innerHTML=
  '<div class="wkbar"><a class="bk" href="'+prevScreen()+'">‹</a><h2>'+t('সম্মতি','Consent')+'</h2>'+
  '<span class="wklang"><button class="'+(lang==='bn'?'on':'')+'" onclick="setLang(\'bn\')">বাং</button><button class="'+(lang==='en'?'on':'')+'" onclick="setLang(\'en\')">EN</button></span></div>'+
  '<div class="stepper"><i class="st done"></i><i class="st done"></i><i class="st done"></i><i class="st on"></i><i class="st"></i></div>'+
  '<div class="steplabel">'+t('ধাপ ৪ / ৫ · সম্মতি','Step 4 / 5 · Consent')+'</div>'; }
function line(k, bodyKey, opts){ opts=opts||{};
  var on=accepted(k), ts=on?stamp(k):null, ver=(P.CONSENT_VERSIONS[k]||'1.0');
  return '<label class="cl'+(opts.umbrella?' umbrella':'')+'"><input type="checkbox" '+(on?'checked':'')+' onchange="toggle(\''+k+'\')"><span class="cbx">✓</span>'+
    '<div>'+(opts.tag?'<span class="tag">'+opts.tag+'</span>':'')+'<p>'+L(bodyKey)+'</p>'+
    (opts.sub?'<div class="sub">'+opts.sub+'</div>':'')+
    (on?'<div class="ts">✓ '+t('সম্মত ','accepted ')+fmtTs(ts)+' · v'+ver+'</div>':'')+'</div></label>'; }
function render(){
  bar();
  var h='<p class="phelp" style="margin-top:12px">'+L('consent.intro')+'</p>'+
    line('terms','consent.terms')+
    line('privacy','consent.privacy')+
    line('program','consent.program')+
    // 6.1.3 — the umbrella data-handling undertaking (distinct, once, up front)
    line('dataHandling','consent.dataHandling',{ umbrella:true, tag:L('consent.dataHandling.tag'), sub:L('consent.dataHandling.help') });
  if(needInvest()){
    h+='<div class="disc-line">'+L('consent.investDisclaimer')+'</div>';
    h+=line('invest','consent.invest');
  }
  document.getElementById('form').innerHTML=h;
  var bk=document.getElementById('back'); if(bk) bk.href=prevScreen();
  var ok=accepted('terms')&&accepted('privacy')&&accepted('program')&&accepted('dataHandling')&&(!needInvest()||accepted('invest'));
  var n=document.getElementById('next'); n.textContent=L('consent.continue'); n.style.opacity=ok?'1':'.5'; n.style.pointerEvents=ok?'auto':'none';
}
function setLang(l){ lang=l; document.documentElement.lang=l; render(); }
render();
</script>
</body></html>
