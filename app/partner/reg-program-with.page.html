<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Salmon Partner · With Investment (registration)</title>
<link rel="stylesheet" href="../_shared.css"/>
<script src="../assets/js/partner-state.js"></script>
<script src="../assets/js/program-info.js"></script>
<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/network-sim.js"></script>
<style>
  .secblock{margin:14px 16px 0;padding:0 0 14px;border-bottom:1px solid var(--line,#eee)}
  .secblock:last-child{border-bottom:none}
  .sechint{font-size:12.5px;color:var(--ink-subtle);line-height:1.55;margin:0 0 8px}
  .copyph{font-size:11px;font-weight:800;letter-spacing:.03em;color:#7a5a2a;background:#fbf1dd;border:1px dashed #e4c98a;border-radius:8px;padding:8px 10px}
  .secmand{background:#fbf3f5;border:1px solid #e6cdd5;border-radius:12px;padding:12px;margin-left:16px;margin-right:16px}
  .secmand .copyph{color:#6a4a52;background:#f4e6ea;border-color:#dcb3c0}
  .reqtag{font-size:9px;font-weight:800;letter-spacing:.05em;color:#fff;background:var(--primary,#800020);border-radius:4px;padding:1px 6px;vertical-align:middle}
  .legalrow{font-size:11px;font-weight:800;letter-spacing:.03em;color:#7a2a2a;background:#f7e7e7;border:1px dashed #e0aeae;border-radius:8px;padding:7px 10px;margin-top:8px}
  .framing{font-size:12px;color:#6a4a52;line-height:1.55;margin-top:8px}
  .topdisc{background:#f4e6ea;border:1px solid #e6cdd5;color:#6a4a52;border-radius:10px;margin:12px 16px 0;padding:11px 13px;font-size:12px;line-height:1.55}
  /* REG05b — eligibility acknowledgment, merged into this step as a gate */
  .eligbox{margin:14px 16px 0;background:#fbf5f7;border:1px solid #e6cdd5;border-radius:12px;padding:13px}
  .eligbox h4{font-size:13px;font-weight:800;color:var(--primary);margin:0 0 4px}
  .eligbox p{font-size:12px;color:#6a4a52;line-height:1.5;margin:0 0 10px}
  .eligack{display:flex;gap:11px;align-items:flex-start;cursor:pointer}
  .eligack input{position:absolute;opacity:0}
  .eligack .cbx{width:22px;height:22px;border-radius:6px;border:1.6px solid #cbb9ad;background:#fff;display:grid;place-items:center;color:#fff;font-size:13px;flex:0 0 auto;margin-top:1px}
  .eligack input:checked + .cbx{background:var(--primary);border-color:var(--primary)}
  .eligack span.lbl{font-size:12.5px;color:var(--ink);line-height:1.5}
</style>
</head><body>
<div class="page-label">REG04b · With Investment — registration path (gated) <small>Six sections + MANDATORY disclaimer · REG05b eligibility acknowledgment merged as the gate · no rate/amount/guarantee</small></div>
<div class="device">
  <div class="statusbar"><span>9:41</span><span>Salmon</span><span>●●● ▮</span></div>
  <div id="top" style="flex:0 0 auto"></div>
  <div class="screen" style="padding-bottom:80px" id="screen"></div>
  <div class="pbtnbar"><a class="btn ghost" id="back" href="p04-program.page.html" style="flex:0 0 auto">‹</a><a class="btn" id="next" href="p05-consent.page.html" style="flex:1">Continue</a></div>
</div>
<script>
var P=window.Partner, lang='en', d=P.getDraft();
function t(bn,en){ return lang==='bn'?bn:en; }
function acked(){ return !!P.getDraft().withEligAck; }
function toggleAck(){ P.saveDraft({ withEligAck: !acked() }); render(); }
// Same 6.3.4 discipline as P18: no rate/amount/projection; frequency + higher-tier
// commission only as client-approved placeholders. Reused verbatim from program-with.
function benefitsExtra(l){
  return '<div class="sechint" style="margin-top:8px">'+(l==='bn'
      ? 'উইথ ইনভেস্টমেন্ট পার্টনার জিরো-এর চেয়ে উচ্চতর টিয়ার কমিশন পান (হার ক্লায়েন্ট-অনুমোদিত কপিতে)।'
      : 'With Investment partners earn a higher-tier commission than Zero Investment (the wording is client-approved).')+'</div>'+
    '<div class="sechint" style="margin-top:4px">'+(l==='bn'
      ? 'যেকোনো উচ্চতর-টিয়ার কমিশন হাতে বসানো হয় — কখনো হিসাব বা প্রিভিউ করা হয় না।'
      : 'Any higher-tier commission is entered by hand — never computed or previewed here.')+'</div>';
}
function conditionsExtra(l){
  return '<div class="legalrow">'+(l==='bn'?'রিটার্ন হার / পরিমাণ: ':'Return rate / amount: ')+'[LEGAL SIGN-OFF REQUIRED]</div>'+
    '<div class="sechint" style="margin-top:6px">'+(l==='bn'
      ? 'কোনো রিটার্ন সংখ্যা, পরিমাণ, পূর্বাভাস বা ক্যালকুলেটর দেখানো হয় না।'
      : 'No return figure, amount, projection or calculator is shown.')+'</div>';
}
function disclaimersExtra(l){
  return '<div class="framing">'+(l==='bn'
      ? '“স্যামন ডেভেলপার্স আপনার সম্মত শর্ত অনুযায়ী অংশগ্রহণ ও রিটার্ন রেকর্ড করে। এই অ্যাপ বিনিয়োগ পরামর্শ দেয় না বা কোনো রিটার্নের নিশ্চয়তা দেয় না।”'
      : '“Salmon Developers records participation and returns under your agreed terms. This app does not provide investment advice or guarantee any return.”')+
    ' <span class="legalrow" style="display:inline-block;margin-top:6px">[EXACT WORDING — LEGAL CONFIRMATION REQUIRED]</span></div>';
}
var CFG={ variant:'with', sections:{
  description:{ hintBn:'অনুমোদিত প্রকল্পে একটি শেয়ার নিন; অংশগ্রহণ ও রিটার্ন আপনার সম্মত শর্ত অনুযায়ী রেকর্ড হয়।', hintEn:'Take a share in an approved project; participation and returns are recorded under your agreed terms.' },
  eligibility:{ hintBn:'যোগ্যতা-নিয়ন্ত্রিত — একজন স্যামন অ্যাডমিন অনুমোদন করেন (৬.১ গেট)।', hintEn:'Eligibility-gated — a Salmon admin approves participation (the 6.1 gate).' },
  responsibilities:{ hintBn:'সম্মত শর্ত মেনে চলা; স্যামন-অনুমোদিত উপকরণ ব্যবহার।', hintEn:'Meet the agreed terms; use Salmon-approved material.' },
  benefits:{ hintBn:'উচ্চতর-টিয়ার কমিশন + একটি রেকর্ডকৃত রিটার্ন (নিচে দেখুন)।', hintEn:'Higher-tier commission plus a recorded return (see below).', extra:benefitsExtra },
  conditions:{ placeholder:'[CLIENT-APPROVED COPY REQUIRED — frequency]', hintBn:'রিটার্ন একটি নির্দিষ্ট ফ্রিকোয়েন্সিতে রেকর্ড হয় (মাসিক/বার্ষিক/চুক্তি অনুযায়ী — ক্লায়েন্ট-অনুমোদিত)।', hintEn:'The return is recorded at a stated frequency (monthly / annual / per-agreement — client-approved).', extra:conditionsExtra },
  disclaimers:{ placeholder:'[LEGAL DISCLAIMER COPY REQUIRED]', hintBn:'বাধ্যতামূলক ও প্রকট — কপি স্যামনের আইনজীবীর কাছ থেকে।', hintEn:'Mandatory and prominent — copy comes from Salmon’s legal counsel.', extra:disclaimersExtra }
}};
function bar(){
  var both=P.getDraft().program==='both';
  document.getElementById('top').innerHTML=
  '<div class="wkbar"><a class="bk" id="bk" href="'+(both?'reg-program-zero.page.html':'p04-program.page.html')+'">‹</a><h2>'+t('উইথ ইনভেস্টমেন্ট','With Investment')+'</h2>'+
  '<span class="wklang"><button class="'+(lang==='bn'?'on':'')+'" onclick="setLang(\'bn\')">বাং</button><button class="'+(lang==='en'?'on':'')+'" onclick="setLang(\'en\')">EN</button></span></div>'+
  '<div class="stepper"><i class="st done"></i><i class="st done"></i><i class="st on"></i><i class="st"></i><i class="st"></i></div>'+
  '<div class="steplabel">'+t('ধাপ ৩ / ৫ · প্রোগ্রাম বিবরণ ও যোগ্যতা (উইথ)','Step 3 / 5 · Program details & eligibility (With)')+'</div>'; }
function render(){
  bar();
  var both=P.getDraft().program==='both';
  document.getElementById('back').href = both ? 'reg-program-zero.page.html' : 'p04-program.page.html';
  document.getElementById('screen').innerHTML=
    // mandatory disclaimer surfaced at the top too (prominence)
    '<div class="topdisc"><b>'+t('দাবিত্যাগ','Disclaimer')+':</b> [LEGAL DISCLAIMER COPY REQUIRED] — '+t('স্যামন গ্যারান্টর বা বিনিয়োগ উপদেষ্টা নয়; কোনো রিটার্ন নিশ্চিত নয়।','Salmon is not a guarantor or investment adviser; no return is guaranteed.')+'</div>'+
    window.ProgramInfo.render(lang,CFG)+
    // REG05b — eligibility acknowledgment, the gate that sets expectation
    '<div class="eligbox"><h4>'+t('যোগ্যতা স্বীকৃতি','Eligibility acknowledgment')+'</h4>'+
      '<p>'+t('উইথ ইনভেস্টমেন্ট নথিভুক্তি অ্যাডমিন অনুমোদন সাপেক্ষে। জমা দিলে আপনার আবেদন সারিতে যাবে; একজন স্যামন অ্যাডমিন পৃথকভাবে এটি চালু করবেন।','With Investment enrolment is subject to administrator approval. Submitting sends your application to the queue; a Salmon admin activates it separately.')+'</p>'+
      '<label class="eligack"><input type="checkbox" id="ack" '+(acked()?'checked':'')+' onchange="toggleAck()"><span class="cbx">✓</span>'+
      '<span class="lbl">'+t('আমি বুঝেছি যে উইথ ইনভেস্টমেন্ট অংশগ্রহণ স্বয়ংক্রিয় নয় — এটি অ্যাডমিন সক্রিয়করণের অপেক্ষায় থাকে।','I understand With Investment participation is not automatic — it awaits admin activation.')+'</span></label></div>'+
    '<p class="phelp" style="margin:14px 16px 16px">'+t('উচ্চতর টিয়ার হার, যোগ্যতা ও রিটার্ন শর্ত আইনি অনুমোদনের অপেক্ষায় (OPEN_QUESTIONS)।','The higher-tier rate, eligibility rule and return terms are blocked on legal approval (OPEN_QUESTIONS).')+'</p>';
  var n=document.getElementById('next'); var ok=acked();
  n.textContent=t('সম্মতিতে যান','Continue to consent');
  n.style.opacity=ok?'1':'.5'; n.style.pointerEvents=ok?'auto':'none';
}
function setLang(l){ lang=l; document.documentElement.lang=l; render(); }
render();
</script>
</body></html>
