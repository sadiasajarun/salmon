<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Salmon Partner · Enrolment</title>
<link rel="stylesheet" href="../_shared.css"/>
<script src="../assets/js/partner-state.js"></script>
<script src="../assets/js/network-sim.js"></script>
<style>.wklang{display:inline-flex;border:1px solid #ffffff55;border-radius:999px;overflow:hidden}.wklang button{border:none;background:transparent;color:#fdf3f1;font-size:12px;padding:5px 9px;cursor:pointer}
.reasonline{font-size:11.5px;color:#6a4a52;background:#f4e6ea;border:1px solid #e6cdd5;border-radius:8px;padding:7px 10px;margin:6px 16px 0;line-height:1.5}</style>
</head><body>
<div class="page-label">P19 · Enrolment status <small>Per-program status + enrolment date; suspend/close show reason + date</small></div>
<div class="device">
  <div class="statusbar"><span>9:41</span><span>Salmon</span><span>●●● ▮</span></div>
  <div class="screen" id="screen" style="padding-bottom:20px"></div>
</div>
<script>
var P=window.Partner, lang='en';
function t(bn,en){ return lang==='bn'?bn:en; }
function fmt(iso){ if(!iso) return '—'; try{ return new Intl.DateTimeFormat(lang==='bn'?'bn-BD':'en-GB',{day:'numeric',month:'short',year:'numeric'}).format(new Date(iso)); }catch(e){return iso;} }
function statusChip(st,requested){
  if(st==='active') return '<span class="st st-ongoing"><span class="gl">✓</span>'+t('সক্রিয়','Active')+'</span>';
  if(st==='suspended') return '<span class="st st-pending"><span class="gl">‖</span>'+t('স্থগিত','Suspended')+'</span>';
  if(st==='closed') return '<span class="st st-completed"><span class="gl">•</span>'+t('বন্ধ','Closed')+'</span>';
  if(requested) return '<span class="st st-pending"><span class="gl">…</span>'+t('অনুমোদনের অপেক্ষায়','Awaiting approval')+'</span>';
  return '<span class="st st-completed"><span class="gl">•</span>'+t('উপলব্ধ','Available')+' ›</span>';
}
function metaLine(k,part,requested){
  if(part.status==='active') return t('যোগ দিয়েছেন ','Enrolled ')+fmt(part.enrolledAt);
  if(part.status==='suspended') return t('স্থগিত ','Suspended ')+fmt(part.reasonAt);
  if(part.status==='closed') return t('বন্ধ ','Closed ')+fmt(part.reasonAt);
  if(requested) return t('অনুরোধ পর্যালোচনাধীন','Request under review');
  if(k==='withInvestment' && !P.eligibleFor('with')) return t('অনুমোদন সাপেক্ষে উপলব্ধ','Available on approval');
  return t('যোগ দেননি','Not enrolled');
}
function render(){
  var progs=['zeroInvestment','withInvestment'];
  var rows=progs.map(function(k){
    var pr=P.PROGRAMS[k];
    var part=(P.identity.participation&&P.identity.participation[k])||{status:'notEnrolled'};
    var requested=k==='withInvestment' && part.status==='notEnrolled' && part.requestedAt;
    var link=k==='zeroInvestment'?'program-zero.page.html':'program-with.page.html';
    var row='<a class="row" style="text-decoration:none;color:inherit" href="'+link+'"><span><span class="u">'+t(pr.bn,pr.en)+'</span><br><span class="sub">'+metaLine(k,part,requested)+'</span></span>'+
      statusChip(part.status,requested)+'</a>';
    // reason + date shown verbatim when suspended or closed
    if((part.status==='suspended'||part.status==='closed') && part.reason){
      row+='<div class="reasonline"><b>'+t('কারণ','Reason')+':</b> '+part.reason+'</div>';
    }
    return row;
  }).join('');
  document.getElementById('screen').innerHTML=
    '<div class="wkbar"><a class="bk" href="dashboard.page.html">‹</a><h2>'+t('এনরোলমেন্ট','Enrolment')+'</h2>'+
    '<span class="wklang"><button class="'+(lang==='bn'?'on':'')+'" onclick="setLang(\'bn\')">বাং</button><button class="'+(lang==='en'?'on':'')+'" onclick="setLang(\'en\')">EN</button></span></div>'+
    '<p class="phelp" style="margin:12px 16px 4px">'+t('প্রতিটি প্রোগ্রামের নিজস্ব স্ট্যাটাস ও যোগদানের তারিখ আছে — আপনার অ্যাকাউন্ট স্ট্যাটাস থেকে আলাদা।','Each program has its own status and enrolment date — separate from your account status.')+'</p>'+
    '<div class="rowlist" style="margin:6px 16px 12px">'+rows+'</div>'+
    '<p class="phelp" style="margin:0 16px">'+t('স্ট্যাটাস পরিবর্তন করেন শুধু স্যামন অ্যাডমিন (অ্যাক্টিভেট / সাসপেন্ড / ক্লোজ)। বন্ধ হলেও রেকর্ড রক্ষিত থাকে।','Only a Salmon admin changes status (activate / suspend / close). A closed program keeps its record.')+'</p>';
}
function setLang(l){ lang=l; document.documentElement.lang=l; render(); }
render();
</script>
</body></html>
